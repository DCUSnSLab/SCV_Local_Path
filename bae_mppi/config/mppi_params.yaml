mppi_controller:
  ros__parameters:
    # 디바이스 설정
    use_gpu: true                # GPU 사용 여부 (성능 향상)
    
    # 제어 설정
    control_frequency: 10.0       # Hz - 제어 주파수 (실시간 성능 고려)
    viz_frequency: 10.0           # Hz - 시각화 주파수 (성능 최적화)
    dt: 0.1                      # seconds - 시간 간격
    
    # MPPI 알고리즘 파라미터
    horizon_steps: 100            # 예측 시간 스텝 수
    num_samples: 5000             # 샘플 궤적 개수 (성능 고려하여 감소)
    lambda_: 1.0                 # 온도 파라미터 (exploration vs exploitation)
    sigma: [0.8, 0.8]           # [속도_노이즈, 조향각_노이즈] - 탐색 강도
    
    # 차량 제약 조건 (HUNTER 2.0 Ackermann 모델)
    max_linear_vel: 0.5          # m/s - 최대 직진 속도 (7.2 km/h)
    max_steering_angle: 0.39     # rad (약 22도) - 최대 조향각 (turning radius 1.6m 기준)
    wheelbase: 0.65              # m - 전후축 간 거리 (HUNTER 2.0 실제 스펙)
    
    # 비용 함수 가중치 설정
    obstacle_cost:
      safety_radius: 0.8         # m - 안전 반경 (HUNTER 2.0 크기 고려한 장애물과의 최소 거리)
      max_range: 100.0           # m - 레이저 센서 최대 감지 거리
      penalty_weight: 1000.0     # 장애물 페널티 가중치 (균형잡힌 값)
      exponential_factor: 3.0    # 지수 페널티 계수 (거리에 따른 가파름)
    
    goal_cost:
      goal_weight: 0.3           # 목표점 추적 가중치
      angle_weight: 0.5          # 방향 추적 가중치
    
    control_cost:
      linear_weight: 0.5         # 직진 제어 노력 가중치
      angular_weight: 0.5        # 회전 제어 노력 가중치
    
    # 레이저 스캔 처리 설정
    laser:
      min_range: 0.1             # m - 최소 감지 거리
      max_range: 100.0           # m - 최대 감지 거리 (시뮬레이션 환경)
      angle_increment_filter: 1  # 각도 증분 필터
      cluster_radius: 0.3        # m - 클러스터 반경
      robot_radius: 0.2          # m - 로봇 반경
    
    # 로봇 외형 정의 (HUNTER 2.0: 980x745mm, 평면화된 좌표: [x1,y1,x2,y2,x3,y3,x4,y4])
    footprint: [0.49, 0.3725, 0.49, -0.3725, -0.49, -0.3725, -0.49, 0.3725]
    footprint_padding: 0.05      # m - 외형 패딩 (안전 여유)